
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Advanced LeetCode Dashboard</title>

  <style>

    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
      font-family:Arial, sans-serif;
    }

    body{
      background:#020617;
      color:white;
      padding:30px;
    }

    .container{
      max-width:1300px;
      margin:auto;
    }

    h1{
      text-align:center;
      font-size:55px;
      margin-bottom:35px;
    }

    .card-grid{
      display:grid;
      grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
      gap:25px;
      margin-bottom:40px;
    }

    .card{
      background:#1e293b;
      padding:35px 20px;
      border-radius:20px;
      text-align:center;
      transition:0.3s;
    }

    .card:hover{
      transform:translateY(-5px);
    }

    .card h2{
      margin-bottom:15px;
      font-size:28px;
    }

    .card p{
      font-size:45px;
      font-weight:bold;
    }

    .easy{ color:#22c55e; }
    .medium{ color:#facc15; }
    .hard{ color:#ef4444; }

    .section{
      margin-top:30px;
      background:#1e293b;
      padding:30px;
      border-radius:20px;
    }

    .section h2{
      margin-bottom:25px;
      font-size:35px;
    }

    .filters{
      display:flex;
      flex-wrap:wrap;
      gap:15px;
      margin-bottom:25px;
    }

    select{
      padding:12px 18px;
      border:none;
      border-radius:10px;
      font-size:16px;
      background:#0f172a;
      color:white;
      outline:none;
    }

    table{
      width:100%;
      border-collapse:collapse;
    }

    th{
      background:#0f172a;
      padding:18px;
      text-align:left;
      font-size:18px;
    }

    td{
      padding:18px;
      border-bottom:1px solid #334155;
    }

    tr:hover{
      background:#334155;
    }

    a{
      color:#60a5fa;
      text-decoration:none;
      font-weight:bold;
    }

    .tag{
      padding:6px 12px;
      border-radius:8px;
      font-size:14px;
      font-weight:bold;
    }

    .cpp{
      background:#1d4ed8;
    }

    .js{
      background:#ca8a04;
    }

    .both{
      background:#16a34a;
    }

    .loading{
      text-align:center;
      margin-top:30px;
      font-size:24px;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>Advanced LeetCode Dashboard</h1>

  <div class="card-grid">

    <div class="card">
      <h2>Total Solved</h2>
      <p id="total">0</p>
    </div>

    <div class="card">
      <h2>Easy</h2>
      <p class="easy" id="easy">0</p>
    </div>

    <div class="card">
      <h2>Medium</h2>
      <p class="medium" id="medium">0</p>
    </div>

    <div class="card">
      <h2>Hard</h2>
      <p class="hard" id="hard">0</p>
    </div>

  </div>

  <div class="section">

    <h2>Language Filters</h2>

    <div class="filters">

      <select id="filterType">
        <option value="all">All Problems</option>
        <option value="cpp">Only C++</option>
        <option value="js">Only JavaScript</option>
        <option value="both">Solved In Both</option>
        <option value="cppNotJs">C++ But Not JS</option>
        <option value="jsNotCpp">JS But Not C++</option>
      </select>

    </div>

    <table>

      <thead>
        <tr>
          <th>Question</th>
          <th>Languages Used</th>
          <th>Total Submissions</th>
        </tr>
      </thead>

      <tbody id="submissionTable"></tbody>

    </table>

  </div>

  <div class="loading" id="loading">
    Loading Data...
  </div>

</div>

<script>

const username = "jilan2410";

let groupedProblems = [];

async function fetchLeetCodeData(){

  try{

    const response = await fetch(
      `https://leetcode-api-faisalshohag.vercel.app/${username}`
    );

    const data = await response.json();

    document.getElementById("total").innerText = data.totalSolved;
    document.getElementById("easy").innerText = data.easySolved;
    document.getElementById("medium").innerText = data.mediumSolved;
    document.getElementById("hard").innerText = data.hardSolved;

    const submissions = data.recentSubmissions;

    const map = {};

    submissions.forEach(sub => {

      if(!map[sub.title]){

        map[sub.title] = {
          title: sub.title,
          titleSlug: sub.titleSlug,
          languages: new Set(),
          count: 0
        };
      }

      map[sub.title].languages.add(sub.lang);
      map[sub.title].count++;

    });

    groupedProblems = Object.values(map).map(item => ({
      ...item,
      languages: Array.from(item.languages)
    }));

    renderTable(groupedProblems);

    document.getElementById("loading").style.display = "none";

  }

  catch(error){

    console.log(error);

    document.getElementById("loading").innerText =
      "Failed To Load Data";

  }

}

function renderTable(data){

  const table = document.getElementById("submissionTable");

  table.innerHTML = "";

  data.forEach(problem => {

    const row = document.createElement("tr");

    let tags = "";

    problem.languages.forEach(lang => {

      if(lang.includes("C++")){
        tags += `<span class="tag cpp">C++</span> `;
      }

      else if(lang.includes("JavaScript")){
        tags += `<span class="tag js">JavaScript</span> `;
      }

      else{
        tags += `<span class="tag both">${lang}</span> `;
      }

    });

    row.innerHTML = `

      <td>
        <a
          href="https://leetcode.com/problems/${problem.titleSlug}/"
          target="_blank"
        >
          ${problem.title}
        </a>
      </td>

      <td>${tags}</td>

      <td>${problem.count}</td>

    `;

    table.appendChild(row);

  });

}

function applyFilter(){

  const filter = document.getElementById("filterType").value;

  let filtered = [];

  if(filter === "all"){
    filtered = groupedProblems;
  }

  else if(filter === "cpp"){
    filtered = groupedProblems.filter(problem =>
      problem.languages.some(lang => lang.includes("C++"))
    );
  }

  else if(filter === "js"){
    filtered = groupedProblems.filter(problem =>
      problem.languages.some(lang => lang.includes("JavaScript"))
    );
  }

  else if(filter === "both"){
    filtered = groupedProblems.filter(problem => {

      const hasCpp = problem.languages.some(lang =>
        lang.includes("C++")
      );

      const hasJs = problem.languages.some(lang =>
        lang.includes("JavaScript")
      );

      return hasCpp && hasJs;

    });
  }

  else if(filter === "cppNotJs"){

    filtered = groupedProblems.filter(problem => {

      const hasCpp = problem.languages.some(lang =>
        lang.includes("C++")
      );

      const hasJs = problem.languages.some(lang =>
        lang.includes("JavaScript")
      );

      return hasCpp && !hasJs;

    });

  }

  else if(filter === "jsNotCpp"){

    filtered = groupedProblems.filter(problem => {

      const hasCpp = problem.languages.some(lang =>
        lang.includes("C++")
      );

      const hasJs = problem.languages.some(lang =>
        lang.includes("JavaScript")
      );

      return hasJs && !hasCpp;

    });

  }

  renderTable(filtered);

}


document
  .getElementById("filterType")
  .addEventListener("change", applyFilter);

fetchLeetCodeData();

</script>

</body>
</html>
